[package]
name = "transport-mac"
description = "macOS virtual HID transport over IOHIDUserDevice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
ctaphid = { workspace = true, features = ["std"] }
ctap2 = { workspace = true, features = ["std"] }
se-fido-store.workspace = true
backend-se.workspace = true

[[bin]]
name = "se-fido-device"
path = "src/bin/se-fido-device.rs"
