[workspace]
resolver = "2"
members = [
    "crates/ctaphid",
    "crates/ctap2",
    "crates/store",
    "crates/backend-se",
    "crates/transport-test",
    "crates/transport-mac",
    "crates/fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
publish = false

[workspace.dependencies]
p256 = { version = "^0.13", default-features = false }
sha2 = { version = "^0.10", default-features = false }
hkdf = { version = "^0.12", default-features = false }
aes-gcm = { version = "^0.10", default-features = false }

ctaphid = { path = "crates/ctaphid", default-features = false }
ctap2 = { path = "crates/ctap2", default-features = false }
se-fido-store = { path = "crates/store" }
backend-se = { path = "crates/backend-se" }
transport-test = { path = "crates/transport-test" }
transport-mac = { path = "crates/transport-mac" }
