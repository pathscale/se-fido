[workspace]
resolver = "2"
members = [
    "crates/ctaphid",
    "crates/ctap2",
    "crates/store",
    "crates/backend-se",
    "crates/transport-test",
    "crates/transport-mac",
    "crates/fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/pathscale/se-fido"
publish = false

[workspace.dependencies]
p256 = { version = "^0.13", default-features = false }
sha2 = { version = "^0.10", default-features = false }
hkdf = { version = "^0.12", default-features = false }
chacha20poly1305 = { version = "^0.10", default-features = false }

ctaphid = { package = "se-fido-ctaphid", path = "crates/ctaphid", version = "^0.1", default-features = false }
ctap2 = { package = "se-fido-ctap2", path = "crates/ctap2", version = "^0.1", default-features = false }
se-fido-store = { path = "crates/store", version = "^0.1" }
backend-se = { package = "se-fido-backend-se", path = "crates/backend-se", version = "^0.1" }
transport-test = { path = "crates/transport-test" }
transport-mac = { path = "crates/transport-mac" }
